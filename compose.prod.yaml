# Production stack. Start with `pnpm prod:up`, stop with `pnpm prod:down`.
# Reads POSTGRES_PASSWORD, BETTER_AUTH_SECRET, BETTER_AUTH_URL, the Google and GitHub keys, the
# email settings and WEB_PORT from .env (see .env.example); DB_PORT is not used here.
name: buildinio-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildinio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: buildinio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildinio -d buildinio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://buildinio:${POSTGRES_PASSWORD}@postgres:5432/buildinio
      PORT: "4000"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      # Where people open the web app; Google and GitHub send them back to it after signing in.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Email sign-in: the codes are sent over SMTP. Empty settings use the API's defaults.
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env (email sign-in)}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env (email sign-in)}
      EMAIL_CODE_EXPIRES_MINUTES: ${EMAIL_CODE_EXPIRES_MINUTES:-}
      EMAIL_CODE_MAX_TRIES: ${EMAIL_CODE_MAX_TRIES:-}
      EMAIL_CODE_RESEND_SECONDS: ${EMAIL_CODE_RESEND_SECONDS:-}
      EMAIL_CODE_LIMIT_PER_EMAIL: ${EMAIL_CODE_LIMIT_PER_EMAIL:-}
      EMAIL_CODE_LIMIT_PER_IP: ${EMAIL_CODE_LIMIT_PER_IP:-}
      EMAIL_CODE_CHECK_LIMIT_PER_IP: ${EMAIL_CODE_CHECK_LIMIT_PER_IP:-}
      EMAIL_CODE_LIMIT_TOTAL: ${EMAIL_CODE_LIMIT_TOTAL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    # Serves /api/* from the API (API_URL is set in its Dockerfile).
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
